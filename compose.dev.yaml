services:
  api:
    build:
      target: development
    command: pnpm --filter @nosh/api dev
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --conditions=development
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
      DATABASE_PATH: /data/nosh.sqlite
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/contracts/src:/app/packages/contracts/src
  web:
    build:
      target: development
    command: pnpm --filter @nosh/web dev --port 80
    environment:
      API_PROXY_TARGET: http://api:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/contracts/src:/app/packages/contracts/src
